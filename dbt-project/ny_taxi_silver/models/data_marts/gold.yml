version: 2

models:

 

  - name: dim_vendor
    description: Taxi vendor dimension.

    columns:
      - name: vendor_key
        data_tests:
          - not_null
          - unique

      - name: vendor_id
        data_tests:
          - not_null
          - unique


  - name: dim_payment_type
    description: Payment type dimension.

    columns:
      - name: payment_type_key
        data_tests:
          - not_null
          - unique

      - name: payment_type
        data_tests:
          - not_null
          - unique


  - name: dim_location
    description: Taxi pickup and dropoff locations.

    columns:
      - name: location_key
        data_tests:
          - not_null
          - unique

      - name: location_id
        data_tests:
          - not_null
          - unique


  - name: dim_date
    description: Date dimension for taxi trips.

    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique

      - name: full_date
        data_tests:
          - not_null
          - unique



  - name: fact_taxi_trips
    description: Taxi trips fact table connected to dimensions.

    columns:
      - name: vendor_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_key

      - name: payment_type_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_key

      - name: pickup_location_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: dropoff_location_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: pickup_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: dropoff_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key