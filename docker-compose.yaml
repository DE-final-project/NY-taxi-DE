services:
  postgres:
    image: postgres:16
    container_name: de-final-project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - de-final-project-net

  # One-shot: creates the Airflow metadata database in Postgres if it does not exist yet.
  postgres-init:
    image: postgres:16
    container_name: de-final-project-postgres-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      sh -c "psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1
      || psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'CREATE DATABASE airflow'"
    networks:
      - de-final-project-net

  # Single-node KRaft broker (combined broker+controller roles), no Zookeeper needed.
  kafka:
    image: apache/kafka:3.7.0
    container_name: de-final-project-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - de-final-project-net

  stream-image:
    build: ./stream-image
    image: de-final-project-stream-image
    container_name: de-final-project-stream
    scale: 0   # built by `up --build`, but run by Airflow (or `docker compose run`), never on `up`
    restart: "no"
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - de-final-project-net

  # Serves the batch months over HTTP, downloading each Parquet file on first request.
  batch-api:
    build: ./batch-api-image
    image: de-final-project-batch-api-image
    container_name: de-final-project-batch-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - batch_cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - de-final-project-net

  consumer-image:
    build: ./consumer-image
    image: de-final-project-consumer-image
    container_name: de-final-project-consumer
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - de-final-project-net
  # S3-compatible object storage = our Data Lake (Bronze layer).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: de-final-project-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
     - de-final-project-net

  # One-shot: creates the Bronze bucket once MinIO is healthy, then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: de-final-project-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/${MINIO_BUCKET}"
    networks:
      - de-final-project-net

  # Data Warehouse (Silver/Gold). Image build: SQL Server 2022 16.0.4250.1.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: de-final-project-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "1436:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - de-final-project-net

  # One-shot: creates the DWH database if it does not exist yet.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: de-final-project-sqlserver-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "${MSSQL_SA_PASSWORD}" -b
      -Q "IF DB_ID('${MSSQL_DATABASE}') IS NULL CREATE DATABASE [${MSSQL_DATABASE}]"
    networks:
      - de-final-project-net

  # One-shot: incrementally copies new Bronze Parquet files from MinIO into SQL Server raw tables.
  loader:
    build: ./loader-image
    image: de-final-project-loader-image
    container_name: de-final-project-loader
    scale: 0   # built by `up --build`, but run by Airflow (or `docker compose run`), never on `up`
    restart: "no"
    env_file: .env
    depends_on:
      minio-init:
        condition: service_completed_successfully
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - de-final-project-net

  # One-shot: dbt transformations raw -> silver -> gold inside SQL Server.
  # Usage: docker compose run --rm dbt dbt build
  dbt:
    build: ./dbt-image
    image: de-final-project-dbt-image
    container_name: de-final-project-dbt
    scale: 0   # built by `up --build`, but run by Airflow (or `docker compose run`), never on `up`
    restart: "no"
    env_file: .env
    volumes:
      - ./dbt-image/ny_taxi:/usr/app
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - de-final-project-net

  ingest-image:
    build: ./ingest-image
    image: de-final-project-ingest-image
    container_name: de-final-project-ingest
    scale: 0   # built by `up --build`, but run by Airflow (or `docker compose run`), never on `up`
    restart: "no"
    env_file: .env
    depends_on:
      minio-init:
        condition: service_completed_successfully
      batch-api:
        condition: service_healthy
    networks:
      - de-final-project-net
  # Orchestrator: runs the pipeline (ingest -> load -> dbt) as Docker containers via the DAG in airflow/dags.
  # Dev only: `standalone` runs api-server + scheduler + dag-processor in one container, UI without login.
  airflow:
    image: apache/airflow:3.3.2-python3.12
    container_name: de-final-project-airflow
    restart: unless-stopped
    command: standalone
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # new DAGs start active -> no manual unpause
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      sqlserver-init:
        condition: service_completed_successfully
      batch-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - de-final-project-net
networks:
  de-final-project-net:
    name: de-final-project-net
    driver: bridge

volumes:
  pg_data:
  batch_cache:
  minio_data:
  mssql_data: