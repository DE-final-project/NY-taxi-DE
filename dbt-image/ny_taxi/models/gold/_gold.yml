version: 2

models:
  - name: fact_trips
    description: One row per trip (grain = trip). Keys point to the gold dimensions.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]

      - name: pickup_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: vendor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_id

      - name: payment_type_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id

      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id

      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_zone
    columns:
      - name: location_id
        data_tests: [unique, not_null]