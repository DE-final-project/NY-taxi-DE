version: 2

models:
  - name: stg_batch_trips
    description: Staging table for batch trip data

  - name: stg_stream_trips
    description: Staging table for stream trip data

  - name: silver_trips
    description: One clean, de-duplicated row per trip from batch + stream.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: trip_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['batch', 'stream']



  - name: quarantine_trips
    description: Rows rejected by the silver cleaning rules (first rule broken) or extra duplicate copies.
    columns:
      - name: reject_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dropoff_before_pickup
                  - outside_2025
                  - zero_distance
                  - distance_too_long
                  - negative_amount
                  - trip_over_24h
                  - duplicate