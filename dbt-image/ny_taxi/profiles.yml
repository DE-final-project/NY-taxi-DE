# All connection details come from .env (env_file in docker-compose) -- no secrets in git.
ny_taxi:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('MSSQL_HOST', 'sqlserver') }}"
      port: 1433
      database: "{{ env_var('MSSQL_DATABASE') }}"
      schema: dbo
      user: "{{ env_var('MSSQL_USER', 'sa') }}"
      password: "{{ env_var('MSSQL_SA_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 4
